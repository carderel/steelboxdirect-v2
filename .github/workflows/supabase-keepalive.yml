name: Supabase keep-alive

# Pings the Supabase REST API every 3 days so the free-tier project never
# crosses the ~7-day inactivity threshold that triggers an auto-pause.
# Decision: .project-catalog/decisions/2026-07-10-supabase-keepalive.md

on:
  schedule:
    - cron: '0 6 */3 * *'   # 06:00 UTC every 3 days (comfortable margin under the 7-day pause)
  workflow_dispatch: {}      # allow manual runs from the Actions tab

permissions: {}              # no repo token needed

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST (executes a DB query = activity)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::Missing SUPABASE_URL and/or SUPABASE_ANON_KEY repo secrets. Add them in Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "Pinging Supabase at $(date -u +%Y-%m-%dT%H:%M:%SZ) ..."
          code=$(curl -fsS -o /dev/null -w '%{http_code}' \
            --retry 3 --retry-delay 5 --max-time 30 \
            "${SUPABASE_URL}/rest/v1/leads?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          echo "Supabase responded HTTP ${code} — keep-alive query executed."
